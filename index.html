const figAll=()=>[...FIGS,...S.myFigs];
const figSrc=f=>(figAll().find(x=>x.k===f.k)||{}).src||'';
const figCur=()=>S.figs.find(f=>f.id===S.sel&&f.pg===S.page);
function figHTML(f){return `<div class="fg${S.sel===f.id?' sel':''}" data-fg="${f.id}" style="left:${f.x}%;top:${f.y}px;width:${f.w}%;transform:rotate(${f.r}deg);opacity:${f.o/100}"><img src="${figSrc(f)}" alt="" draggable="false" style="${f.fl?'transform:scaleX(-1)':''}"><i class="hd hx" data-fgx="${f.id}" title="Excluir">âœ•</i><i class="hd hr" data-fgr title="Arraste para mudar o tamanho">â—¢</i><i class="hd hrot" data-fgrot title="Arraste para girar">âŸ³</i></div>`}
const figLayer=z=>`<div class="figs ${z==='b'?'back':'front'}">${S.figs.filter(f=>f.pg===S.page&&(z==='b')===(f.z==='b')).map(figHTML).join('')}</div>`;
function figAdd(k){const st=$('#site').getBoundingClientRect();const y=Math.max(30,Math.round(-st.top+130));const f={id:'f'+(++FN),k,x:32,y,w:22,r:0,o:100,z:'f',fl:0,pg:S.page};S.figs.push(f);S.sel=f.id;renderSite();renderPanel();toast('Figura adicionada. Arraste no site para posicionar.')}
function figDel(id){S.figs=S.figs.filter(f=>f.id!==id);if(S.sel===id)S.sel=null;renderSite();renderPanel()}
function figDup(id){const f=S.figs.find(x=>x.id===id);if(!f)return;const c=Object.assign({},f,{id:'f'+(++FN),x:Math.min(90,f.x+4),y:f.y+30});S.figs.push(c);S.sel=c.id;renderSite();renderPanel()}

 const base=isLight(S.a)?'#1a1a1a':'#ffffff',k=mode==='mob'?.6:1;

 };
 return{fullScreen:{enable:false},fpsLimit:60,detectRetina:true,background:{color:'transparent'},particles:P[S.pj]||P.brilhos}}

function parkPj(){if(pjEl&&pjEl.parentNode)pjEl.remove()}

 const ph=document.querySelector('#site .pj-ph');
 if(!ph){if(pjc){if(S.pj==='none'){pjc.destroy();pjc=null;pjSig=''}else pjc.pause()}return}

const loadImg=f=>new Promise(r=>{const fr=new FileReader();fr.onerror=()=>r(null);fr.onload=()=>{const im=new Image();im.onerror=()=>r(null);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(f)});
