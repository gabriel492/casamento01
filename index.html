<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de Sites Personalizados — WebCraft</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            overflow-x: hidden;
        }

        /* Auto-fit Masonry-style Grid */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-auto-rows: 140px;
            grid-auto-flow: dense;
            gap: 16px;
            width: 100%;
            min-height: 100vh;
        }

        /* Card spans for randomized size effect */
        .col-span-1 { grid-column: span 1; }
        .col-span-2 { grid-column: span 2; }
        .row-span-1 { grid-row: span 1; }
        .row-span-2 { grid-row: span 2; }
        .row-span-3 { grid-row: span 3; }

        /* Central hero card grid positioning (non-overlapping) */
        .central-grid-card {
            grid-column: span 2;
            grid-row: span 2;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .central-grid-card {
                grid-column: span 3;
                grid-row: span 2;
            }
        }

        /* Staggered card animation base state */
        .grid-card {
            opacity: 0;
            transform: scale(0.85) translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.3s ease,
                        filter 0.3s ease;
            will-change: opacity, transform;
        }

        /* Revealed state */
        .grid-card.show {
            opacity: 0.35;
            transform: scale(1) translateY(0);
        }

        /* Background template hover highlight */
        .template-card.show:hover {
            opacity: 0.95;
            transform: scale(1.03) translateY(-4px);
            z-index: 20;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.8),
                        0 0 20px rgba(99, 102, 241, 0.3);
        }

        /* Central Highlighted Glass Card */
        .central-card-style {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.96) 0%, rgba(241, 245, 249, 0.92) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                        0 0 60px rgba(99, 102, 241, 0.25);
        }

        .central-card-style.show {
            opacity: 1 !important;
            transform: scale(1) translateY(0);
        }

        /* Top Bar Gradient Line from screenshot */
        .top-gradient-bar {
            height: 4px;
            background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
        }

        /* Modal Overlay */
        .modal-backdrop {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 relative flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Accent Bar -->
    <div class="top-gradient-bar fixed top-0 left-0 right-0 z-50"></div>

    <!-- Header Navigation -->
    <header class="relative z-40 px-6 py-5 flex justify-between items-center max-w-7xl mx-auto w-full pt-6">
        <!-- Logo -->
        <div class="flex items-center gap-3 cursor-pointer">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-layer-group text-white text-lg"></i>
            </div>
            <span class="font-extrabold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                WebCraft<span class="text-indigo-400">.io</span>
            </span>
        </div>

        <!-- Right Side Menu Controls -->
        <div class="flex items-center gap-3">
            <button onclick="triggerStaggerAnimation()" class="px-4 py-2 text-xs md:text-sm font-semibold bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 rounded-full text-slate-200 hover:text-white transition-all flex items-center gap-2 backdrop-blur-md shadow-md active:scale-95">
                <i class="fa-solid fa-rotate-right text-xs text-indigo-400"></i>
                <span>Reiniciar Animação</span>
            </button>
            <button onclick="openBudgetModal()" class="w-10 h-10 rounded-full bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 flex items-center justify-center text-slate-200 hover:text-white transition-all backdrop-blur-md active:scale-95">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Main Container containing Non-overlapping Masonry Grid -->
    <main class="relative z-20 flex-1 p-4 md:p-6 w-full max-w-[1600px] mx-auto">
        <div id="grid-container" class="masonry-grid">
            <!-- Dynamic elements and central card will be injected here by Javascript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-30 px-6 py-4 text-center text-xs text-slate-400/80">
        <p>© 2026 WebCraft Studio. Todos os direitos reservados. Passe o cursor para inspecionar os templates.</p>
    </footer>

    <!-- MODAL: Solicitar Orçamento -->
    <div id="budget-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl relative">
            <button onclick="closeBudgetModal()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-white">Solicitar Projeto</h3>
                    <p class="text-xs text-slate-400">Preencha os dados abaixo para um site personalizado.</p>
                </div>
            </div>

            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Seu Nome</label>
                    <input type="text" required placeholder="Ex: Maria Silva" class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">E-mail Profissional</label>
                    <input type="email" required placeholder="maria@empresa.com" class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Tipo de Projeto</label>
                    <select class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-indigo-500 text-sm transition-colors">
                        <option>Site Institucional / Empresa</option>
                        <option>E-Commerce / Loja Virtual</option>
                        <option>Landing Page de Alta Conversão</option>
                        <option>Portal Customizado</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-indigo-600/30 text-sm mt-2">
                    Enviar Solicitação
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        const templates = [
            { img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=600&auto=format&fit=crop", title: "SaaS & App Platform", tag: "Tech" },
            { img: "https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=600&auto=format&fit=crop", title: "Corporativo Premium", tag: "Business" },
            { img: "https://images.unsplash.com/photo-1522542550221-31fd19575a2d?q=80&w=600&auto=format&fit=crop", title: "Agência Criativa", tag: "Design" },
            { img: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?q=80&w=600&auto=format&fit=crop", title: "Consultoria Financeira", tag: "Fintech" },
            { img: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?q=80&w=600&auto=format&fit=crop", title: "Portfólio Pessoal", tag: "Minimal" },
            { img: "https://images.unsplash.com/photo-1556761175-5973dc0f32e7?q=80&w=600&auto=format&fit=crop", title: "Startup Innovation", tag: "Tech" },
            { img: "https://images.unsplash.com/photo-1542744094-3a31b272c490?q=80&w=600&auto=format&fit=crop", title: "Loja Virtual E-Commerce", tag: "Store" },
            { img: "https://images.unsplash.com/photo-1531403009284-440f080d1e12?q=80&w=600&auto=format&fit=crop", title: "Sistema UI/UX", tag: "SaaS" },
            { img: "https://images.unsplash.com/photo-1551434678-e076c223a692?q=80&w=600&auto=format&fit=crop", title: "Software Landing Page", tag: "Software" },
            { img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=600&auto=format&fit=crop", title: "Co-Working Hub", tag: "Space" },
            { img: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=600&auto=format&fit=crop", title: "Plataforma de Cursos", tag: "Educação" },
            { img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=600&auto=format&fit=crop", title: "Arquitetura & Decor", tag: "Design" },
            { img: "https://images.unsplash.com/photo-1557804506-669a67965ba0?q=80&w=600&auto=format&fit=crop", title: "Marketing de Performance", tag: "Agency" },
            { img: "https://images.unsplash.com/photo-1573164713988-8665fc963095?q=80&w=600&auto=format&fit=crop", title: "Fintech Mobile Bank", tag: "Finance" },
            { img: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=600&auto=format&fit=crop", title: "Desenvolvimento Web", tag: "Code" },
            { img: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=600&auto=format&fit=crop", title: "Gestão de Projetos", tag: "Productivity" }
        ];

        // Random column and row spans for background template cards
        const cardSpans = [
            { col: "col-span-1", row: "row-span-1" },
            { col: "col-span-1", row: "row-span-2" },
            { col: "col-span-2", row: "row-span-1" },
            { col: "col-span-2", row: "row-span-2" },
            { col: "col-span-1", row: "row-span-3" }
        ];

        const gridContainer = document.getElementById('grid-container');

        function renderGrid() {
            gridContainer.innerHTML = '';

            // Calculate total card slots needed
            const totalCards = 22;
            const centralInsertIndex = Math.floor(totalCards / 2) - 1;

            let cardCount = 0;
            let templateIdx = 0;

            for (let i = 0; i < totalCards; i++) {
                // Insert Central Card strictly into the grid stream without overlapping
                if (i === centralInsertIndex) {
                    const heroCard = document.createElement('div');
                    heroCard.id = 'hero-card';
                    heroCard.className = 'grid-card central-grid-card central-card-style rounded-3xl p-8 md:p-12 flex flex-col justify-center items-center text-center shadow-2xl my-auto';
                    
                    heroCard.innerHTML = `
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-100 text-indigo-800 text-xs font-bold uppercase tracking-wider mb-4">
                            <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
                            Websites Sob Medida
                        </div>
                        <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-slate-900 leading-tight mb-4 tracking-tight">
                            Criar sites personalizados.
                        </h1>
                        <p class="text-slate-600 text-sm md:text-base max-w-md mx-auto mb-6">
                            Desenvolvimento de alta performance com design exclusivo focado em conversão.
                        </p>
                        <button onclick="openBudgetModal()" class="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm rounded-2xl shadow-xl transition-all hover:scale-105 active:scale-95 flex items-center gap-2">
                            <span>Solicitar Orçamento</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    `;
                    gridContainer.appendChild(heroCard);
                    continue;
                }

                // Create background template card with randomized dimensions
                const item = templates[templateIdx % templates.length];
                templateIdx++;

                const randomSpan = cardSpans[Math.floor(Math.random() * cardSpans.length)];
                
                const card = document.createElement('div');
                card.className = `grid-card template-card ${randomSpan.col} ${randomSpan.row} relative rounded-2xl overflow-hidden bg-slate-800 border border-slate-700/50 shadow-md cursor-pointer group`;

                card.innerHTML = `
                    <img 
                        src="${item.img}" 
                        alt="${item.title}" 
                        class="w-full h-full object-cover filter saturate-75 group-hover:saturate-100 group-hover:scale-110 transition-all duration-500"
                        onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=Template'"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-transparent opacity-80 group-hover:opacity-30 transition-opacity"></div>
                    <div class="absolute bottom-3 left-3 right-3 text-left">
                        <span class="text-[9px] font-semibold text-indigo-300 bg-indigo-950/80 backdrop-blur-md px-1.5 py-0.5 rounded border border-indigo-800/50 inline-block mb-1">
                            ${item.tag}
                        </span>
                        <h4 class="text-xs font-bold text-white tracking-tight truncate">${item.title}</h4>
                    </div>
                `;

                gridContainer.appendChild(card);
            }
        }

        // Trigger Stagger Reveal Animation
        function triggerStaggerAnimation() {
            const cards = document.querySelectorAll('.grid-card');
            
            cards.forEach(card => card.classList.remove('show'));

            // Sequenced pop-in delay
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('show');
                }, index * 45);
            });
        }

        // Modal Helpers
        function openBudgetModal() {
            document.getElementById('budget-modal').classList.add('open');
        }

        function closeBudgetModal() {
            document.getElementById('budget-modal').classList.remove('open');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            closeBudgetModal();
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 right-6 z-50 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium animate-bounce';
            toast.innerHTML = '<i class="fa-solid fa-circle-check text-lg"></i> Solicitação enviada com sucesso!';
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 4000);
        }

        // Initialize layout
        window.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            setTimeout(triggerStaggerAnimation, 100);
        });

        // Re-render layout smoothly on window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                renderGrid();
                triggerStaggerAnimation();
            }, 300);
        });
    </script>
</body>
</html>
