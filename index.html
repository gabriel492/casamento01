<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ee">
  <meta name="description" content="Crie um site personalizado para seu casamento, aniversário ou celebração. Convites digitais, lista de presentes, fotos e confirmação de presença em um só lugar.">
  <meta property="og:title" content="Festeva — Seu momento, do seu jeito">
  <meta property="og:description" content="Uma história para viver. Crie seu site personalizado para celebrar momentos especiais.">
  <title>Festeva — Seu momento, do seu jeito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory:#f7f3ee; --sand:#e5d8ca; --sage:#a9b4a0; --olive:#626b55;
      --olive-dark:#454d3c; --cocoa:#302923; --muted:#716b64; --white:#fff;
      --line:rgba(48,41,35,.13); --serif:"Playfair Display", Georgia, serif;
      --sans:"DM Sans", Arial, sans-serif; --radius:18px; --ease:cubic-bezier(.2,.7,.2,1);
      --shadow:0 18px 60px rgba(48,41,35,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:90px}
    body{margin:0;background:var(--ivory);color:var(--cocoa);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .container{width:min(1180px,calc(100% - 48px));margin-inline:auto}
    .eyebrow{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--olive);margin:0 0 16px}
    h1,h2,h3,p{margin-top:0}
    h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.035em;line-height:1.08}
    h1{font-size:clamp(3rem,6.1vw,6rem);max-width:700px;margin-bottom:22px}
    h2{font-size:clamp(2.3rem,4.1vw,4.1rem);margin-bottom:20px}
    h3{font-size:1.55rem;margin-bottom:10px}
    p{color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:13px;padding:14px 21px;border-radius:999px;border:1px solid transparent;font-size:.84rem;font-weight:600;transition:transform .25s var(--ease),background .25s,color .25s,border-color .25s;cursor:pointer}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:var(--olive);color:white}
    .btn-primary:hover{background:var(--olive-dark)}
    .btn-light{background:var(--ivory);color:var(--cocoa)}
    .btn-outline{border-color:rgba(48,41,35,.28);background:transparent}
    .btn-outline:hover{background:var(--cocoa);color:white;border-color:var(--cocoa)}
    .arrow{font-size:1.1rem;line-height:1}
    .site-header{height:auto;position:fixed;inset:16px 0 auto;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .nav-wrap{width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,28px);padding:9px 18px;background:rgba(247,243,238,.88);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.48);border-radius:999px;box-shadow:0 8px 32px rgba(30,25,20,.10);pointer-events:auto}
    .site-header:not(.scrolled) .nav-wrap{background:rgba(35,33,28,.30);border-color:rgba(255,255,255,.22);color:#fff}
    .site-header:not(.scrolled) .nav-actions .btn{background:rgba(247,243,238,.94);color:var(--cocoa)}
    .brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:1.65rem;letter-spacing:-.06em;white-space:nowrap}
    .brand-mark{width:22px;height:28px;color:var(--olive)}
    .site-header:not(.scrolled) .brand-mark{color:#fff}
    .nav-links{display:flex;align-items:center;gap:clamp(12px,1.8vw,25px);font-size:.76rem;white-space:nowrap}
    .nav-links a:not(.btn){transition:color .2s}
    .nav-links a:not(.btn):hover{color:var(--olive)}
    .nav-actions{display:flex;align-items:center;gap:13px;font-size:.76rem;white-space:nowrap}
    .nav-actions .btn{padding:8px 14px;font-size:.75rem}
    .menu-toggle{display:none;border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:50%;width:44px;height:44px;color:var(--cocoa);font-size:1.2rem}
    .hero{min-height:100svh;height:100vh;height:100svh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#5b554a}
    .hero-bg{position:absolute;inset:0;overflow:hidden;background:#5b554a}.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 48%;filter:saturate(.82);transform:scale(1.02)}.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,27,22,.72) 0%,rgba(31,32,26,.54) 42%,rgba(31,32,26,.20) 100%),linear-gradient(0deg,rgba(20,21,17,.34),transparent 42%)}
    .hero-content{position:relative;z-index:1;width:100%;padding:100px 0 70px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .hero h1{color:#fff;max-width:900px;margin-inline:auto;text-align:center;text-shadow:0 2px 30px rgba(0,0,0,.14)}.hero h1 em{font-weight:400;color:#e6e4d7;display:block}.hero .eyebrow{color:#e4e4d9}.hero-copy{color:rgba(255,255,255,.88)}.hero .text-link{color:#fff;border-color:rgba(255,255,255,.55)}.hero .btn-primary{background:#f7f3ee;color:#302923}.hero .btn-primary:hover{background:#e5d8ca}.hero .scroll-cue{color:#fff}
    .hero-copy{font-size:1.02rem;max-width:600px;margin:0 auto 27px;line-height:1.8;text-align:center}
    .hero-actions{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
    .text-link{display:inline-flex;align-items:center;gap:10px;font-size:.82rem;font-weight:600;border-bottom:1px solid var(--sand);padding-bottom:5px}
    .scroll-cue{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:.1em;color:#fff;display:flex;align-items:center;gap:12px;white-space:nowrap}
    .scroll-cue span{border:1px solid currentColor;width:23px;height:35px;border-radius:99px;display:grid;place-items:start center;padding-top:7px}
    .scroll-cue span:after{content:"";height:5px;width:2px;background:currentColor;animation:scrollDot 1.6s infinite}
    /* Transição de entrada: a seção Imagine sobe sobre o hero durante a rolagem. */
    .intro-scroll-stage{position:relative;height:400svh;isolation:isolate;background:var(--ivory)}
    .intro-scroll-stage .hero{position:sticky;top:0;height:100svh;min-height:100svh;z-index:1}
    .intro-scroll-stage .editor-section{position:sticky;top:0;z-index:2;margin-top:-100svh;height:100svh;min-height:100svh;padding:0;overflow:hidden;transform:translate3d(0,var(--editor-rise,100svh),0);will-change:transform;background:#fff}
    .collage-stage{height:100%;width:100%;position:relative;overflow:hidden;isolation:isolate;background-color:#f7f3ea;background-image:radial-gradient(rgba(91,73,53,.09) .65px,transparent .65px);background-size:5px 5px}
    .collage-title{position:absolute;z-index:1;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 5vw;pointer-events:none}
    .collage-title h2{font-family:var(--serif);font-size:clamp(3.5rem,10.7vw,10rem);line-height:.83;letter-spacing:-.075em;text-transform:uppercase;color:#171512;margin:0;font-weight:400}
    .collage-title h2 span{display:block;white-space:nowrap;will-change:opacity,transform;transition:none}
    .collage-subtitle{display:none}
    .collage-photo{position:absolute;z-index:3;width:clamp(120px,19vw,270px);aspect-ratio:4/3;object-fit:cover;box-shadow:0 12px 35px rgba(35,28,20,.15);opacity:0;will-change:transform,opacity;transform:translate3d(var(--from-x,0),var(--from-y,0),0) rotate(var(--tilt,0deg)) scale(.88);transition:filter .3s;pointer-events:none}
    /* As fotos se acumulam na área central para cobrir quase toda a frase, como cartas espalhadas na mesa. */
    .collage-photo.p1{left:24%;top:20%;width:clamp(160px,22vw,300px);--from-x:-42vw;--from-y:-35vh;--tilt:-7deg}
    .collage-photo.p2{left:48%;top:16%;width:clamp(160px,22vw,300px);--from-x:42vw;--from-y:-30vh;--tilt:5deg}
    .collage-photo.p3{left:8%;top:35%;width:clamp(155px,21vw,285px);--from-x:-45vw;--from-y:0vh;--tilt:4deg}
    .collage-photo.p4{left:64%;top:36%;width:clamp(160px,22vw,300px);--from-x:45vw;--from-y:2vh;--tilt:-5deg}
    .collage-photo.p5{left:23%;top:54%;width:clamp(155px,20vw,280px);--from-x:-40vw;--from-y:35vh;--tilt:6deg}
    .collage-photo.p6{left:51%;top:53%;width:clamp(160px,21vw,290px);--from-x:40vw;--from-y:35vh;--tilt:-4deg}
    .collage-photo.p7{left:39%;top:29%;width:clamp(145px,18vw,245px);--from-x:0vw;--from-y:-40vh;--tilt:3deg}
    .collage-photo.p8{left:37%;top:66%;width:clamp(145px,19vw,260px);--from-x:0vw;--from-y:40vh;--tilt:-6deg}
    .collage-photo.p9{left:14%;top:48%;width:clamp(145px,18vw,245px);--from-x:-30vw;--from-y:28vh;--tilt:-3deg}
    .collage-photo.p10{left:65%;top:52%;width:clamp(150px,19vw,265px);--from-x:30vw;--from-y:28vh;--tilt:5deg}
    /* Sequência cinematográfica: frase e celebrações em transição lateral controlada pela rolagem. */
    .celebration-story{height:540svh;position:relative;background:#fff;isolation:isolate}
    .story-viewport{position:sticky;top:0;height:100svh;overflow:hidden;background:#fff}
    .story-track{height:100%;width:500%;display:flex;will-change:transform;transform:translate3d(0,0,0)}
    .story-panel{position:relative;flex:0 0 20%;height:100%;overflow:hidden;display:grid;place-items:center;background:#d9d0c3;color:#fff}
    .story-panel::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,14,12,.55),rgba(15,14,12,.08) 55%,rgba(15,14,12,.24));z-index:1}
    .story-panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);will-change:transform}
    .story-panel-copy{position:relative;z-index:2;width:min(900px,calc(100% - 40px));text-align:center;text-shadow:0 3px 30px rgba(0,0,0,.25)}
    .story-panel-copy .eyebrow{color:rgba(255,255,255,.78);margin-bottom:20px}
    .story-panel-copy h2{font-size:clamp(3rem,8vw,7.8rem);line-height:.98;margin:0;color:#fff;text-wrap:balance;overflow:visible}.story-panel-copy h2 .story-word{display:inline-block;will-change:transform,opacity;margin-inline:.07em}
    .story-panel-copy p{font-size:clamp(.95rem,1.5vw,1.15rem);color:rgba(255,255,255,.9);max-width:560px;margin:22px auto 0}
    .story-panel--phrase{background:#fff;color:#211d19}
    .story-panel--phrase::before{background:#fff}
    .story-panel--phrase .story-panel-copy{text-shadow:none}
    .story-panel--phrase .story-panel-copy .eyebrow{color:var(--olive)}
    .story-panel--phrase .story-panel-copy h2{color:#211d19;font-size:clamp(3.4rem,9vw,9rem)}.story-panel--phrase .story-panel-copy h2 .story-word{color:#211d19}.story-panel--phrase .story-panel-copy h2 .story-letter{display:inline-block;opacity:0;transform:translateY(.45em);will-change:opacity,transform}
    .story-panel--phrase .story-panel-copy p{color:#716b64}
    .story-panel-number{position:absolute;z-index:2;bottom:30px;right:36px;color:rgba(255,255,255,.78);font-size:.7rem;letter-spacing:.18em}
    @media(prefers-reduced-motion:reduce){.celebration-story{height:auto}.story-viewport{position:relative;height:auto;overflow:visible}.story-track{width:100%;display:block;transform:none!important}.story-panel{min-height:80svh}.story-panel img{position:absolute}}
    .share-story-section{background:#fff;padding:clamp(88px,12vw,160px) 24px;text-align:center;}
    .share-story-inner{max-width:900px;margin:0 auto;}
    .share-story-section .eyebrow{margin-bottom:22px;}
    .share-story-section h2{font-size:clamp(2.8rem,7vw,6.5rem);line-height:1.02;letter-spacing:-.055em;margin:0 auto 24px;color:#211d19;text-wrap:balance;}
    .share-story-section p{font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.85;max-width:650px;margin:0 auto;color:#716b64;text-wrap:balance;}
    .share-story-section h2 span{display:inline-block;}
    @media(max-width:680px){.share-story-section{padding:82px 22px}.share-story-section h2{font-size:clamp(2.6rem,11vw,4.2rem)}}

    /* Faixa editorial em tela cheia após o carrossel em arco */
    .history-fullscreen{position:relative;min-height:100svh;height:100svh;display:grid;place-items:center;overflow:hidden;background:#39352e;color:#fff;isolation:isolate}
    .history-fullscreen::before{content:"";position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=2400&q=90') center 48%/cover no-repeat;transform:scale(1.025);z-index:-2}
    .history-fullscreen::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,17,.48),rgba(20,20,17,.2) 50%,rgba(20,20,17,.42)),linear-gradient(0deg,rgba(20,20,17,.28),rgba(20,20,17,.12));z-index:-1}
    .history-fullscreen-copy{width:min(1100px,calc(100% - 40px));text-align:center;padding:90px 0 50px}
    .history-fullscreen-number{display:block;margin-bottom:24px;font-size:.75rem;letter-spacing:.28em;font-weight:600;color:rgba(255,255,255,.82)}
    .history-fullscreen h2{margin:0;color:#fff;font-size:clamp(2.8rem,8.2vw,8rem);line-height:.98;letter-spacing:-.055em;text-transform:uppercase;text-wrap:balance;text-shadow:0 4px 35px rgba(0,0,0,.22)}
    @media(max-width:680px){.history-fullscreen-copy{width:calc(100% - 32px)}.history-fullscreen h2{font-size:clamp(2.7rem,11vw,4.7rem)}.history-fullscreen::before{background-position:56% center}}

    .section{padding:105px 0}
    .section-heading{max-width:510px}
    .section-heading p{max-width:430px;line-height:1.85}
    .events-section{background:#fbf9f6}
    .events-layout{display:grid;grid-template-columns:.78fr 1.4fr;gap:70px;align-items:center}
    .event-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .event-card{min-width:0;text-align:center;transition:transform .3s var(--ease)}
    .event-card:hover{transform:translateY(-6px)}
    .event-photo{height:175px;border-radius:13px;overflow:hidden;margin-bottom:14px;background:var(--sand)}
    .event-photo img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
    .event-card:hover img{transform:scale(1.06)}
    .event-card span{font-size:.8rem;font-weight:600}
    .event-icon{display:block;font-size:1.1rem;margin-bottom:5px;color:var(--olive)}
    .editor-section{overflow:hidden}
    .editor-layout{display:grid;grid-template-columns:1.08fr .92fr;gap:95px;align-items:center}
    .editor-visual{position:relative;min-height:440px;display:flex;align-items:center}
    .editor-blob{position:absolute;inset:9% 8% 5% 0;background:#dce0d4;border-radius:48% 52% 39% 61% / 48% 36% 64% 52%;transform:rotate(-5deg)}
    .editor-window{position:relative;z-index:1;width:90%;margin-left:6%;background:white;border:1px solid #e8e2da;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transform:rotate(-2deg)}
    .window-bar{height:42px;border-bottom:1px solid #eee8e0;display:flex;align-items:center;gap:6px;padding:0 14px}
    .window-dot{width:7px;height:7px;border-radius:50%;background:#d8d2ca}
    .window-label{font-size:.65rem;color:#91887f;margin-left:9px}
    .mock-editor{display:grid;grid-template-columns:120px 1fr;min-height:295px}
    .mock-sidebar{background:#faf8f5;padding:17px 12px;display:flex;flex-direction:column;gap:15px;font-size:.65rem;color:#726b62}
    .mock-sidebar strong{font-size:.7rem;color:var(--cocoa);margin-bottom:4px}
    .mock-page{margin:13px;background:#f0e8df;position:relative;min-height:260px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
    .mock-page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
    .mock-page:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(48,41,35,.42),transparent 75%)}
    .mock-page-content{position:relative;z-index:1;color:white;padding:20px;text-shadow:0 2px 15px #0005}
    .mock-page-content small{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase}
    .mock-page-content h3{font-size:2rem;margin:8px 0}
    .mock-phone{position:absolute;z-index:2;right:0;bottom:0;width:130px;padding:7px;background:#fff;border:1px solid #dcd6cc;border-radius:20px;box-shadow:var(--shadow);transform:rotate(4deg)}
    .phone-screen{height:235px;border-radius:14px;overflow:hidden;position:relative;background:#eee}
    .phone-screen img{width:100%;height:100%;object-fit:cover}
    .phone-screen span{position:absolute;bottom:13px;left:7px;right:7px;color:white;font-family:var(--serif);font-size:1rem;text-align:center;text-shadow:0 2px 10px #000}
    .feature-list{list-style:none;margin:27px 0 30px;padding:0;display:grid;gap:13px}
    .feature-list li{display:flex;align-items:center;gap:12px;font-size:.87rem;color:#5c574f}
    .check{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#e4e8df;color:var(--olive);font-size:.72rem;flex:0 0 auto}
    .editor-copy p{line-height:1.85;max-width:450px}
    .inspiration-section{background:#fbf9f6}
    .inspiration-layout{display:grid;grid-template-columns:.72fr 1.55fr;gap:65px;align-items:center}
    .inspiration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .inspiration-card{height:330px;border-radius:13px;overflow:hidden;position:relative;background:#ddd}
    .inspiration-card img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
    .inspiration-card:hover img{transform:scale(1.06)}
    .inspiration-card:after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(transparent,rgba(22,22,17,.72))}
    .inspiration-info{position:absolute;z-index:1;bottom:19px;left:18px;right:14px;color:white}
    .inspiration-info small{font-size:.7rem;opacity:.85}
    .inspiration-info h3{font-size:1.6rem;margin:4px 0 12px}
    .mini-link{display:inline-flex;align-items:center;gap:9px;border:1px solid #ffffff9c;border-radius:99px;padding:7px 12px;font-size:.7rem;color:white}
    .gift-section{padding:0 0 100px}
    .gift-card{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:50px;background:#e8e6dc;border-radius:20px;overflow:hidden;padding:48px 55px}
    .gift-photo{height:350px;border-radius:14px;overflow:hidden}
    .gift-photo img{width:100%;height:100%;object-fit:cover}
    .gift-card p{line-height:1.85}
    .gift-options{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0 28px}
    .pill{font-size:.73rem;border:1px solid #c8c9bb;padding:8px 12px;border-radius:99px;color:#5b6250;background:#f6f5ef}
    .final-cta{position:relative;color:white;overflow:hidden;padding:83px 0;background:#4d5142}
    .final-bg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(35,38,29,.82),rgba(35,38,29,.55)),url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=2000&q=85') center 55%/cover}
    .final-layout{position:relative;display:flex;align-items:center;justify-content:space-between;gap:40px}
    .final-cta .eyebrow{color:#d6ddce}
    .final-cta h2{font-size:clamp(2.3rem,4vw,3.8rem);max-width:600px;margin-bottom:14px}
    .final-cta p{color:#e8e7df;max-width:510px;margin-bottom:24px}
    .final-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 36px;min-width:250px}
    .stat{border-left:1px solid #ffffff75;padding-left:16px}
    .stat strong{font-family:var(--serif);font-size:1.6rem;font-weight:400;display:block}
    .stat span{font-size:.72rem;color:#e8e7df}
    footer{padding:35px 0;background:#f7f3ee}
    .footer-main{display:flex;justify-content:space-between;align-items:center;gap:30px;padding-bottom:25px;border-bottom:1px solid var(--line)}
    .footer-links{display:flex;gap:22px;flex-wrap:wrap;font-size:.75rem;color:#655f57}
    .footer-bottom{display:flex;justify-content:space-between;gap:20px;padding-top:19px;font-size:.68rem;color:#827b72}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
    .reveal.is-visible{opacity:1;transform:translateY(0)}
    .delay-1{transition-delay:.1s}.delay-2{transition-delay:.2s}.delay-3{transition-delay:.3s}
