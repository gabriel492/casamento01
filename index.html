<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebStudio — Criar Sites Personalizados</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0e17;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Barra de Acento Magenta Topo Esquerdo */
        .top-gradient-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 140px;
            height: 4px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            border-bottom-right-radius: 4px;
            z-index: 60;
        }

        /* Wrapper da Seção com Rolação Fluida */
        .scroll-section-wrapper {
            height: 380vh;
            position: relative;
        }

        .sticky-viewport {
            position: sticky;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Layout Grid */
        .exact-grid-container {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.3fr) minmax(0, 1.8fr) minmax(0, 0.9fr) minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 0.8fr);
            grid-template-rows: minmax(0, 1.1fr) minmax(0, 1.4fr) minmax(0, 1.1fr);
            gap: 14px;
            width: 100vw;
            height: 100vh;
            padding: 80px 16px 16px 16px;
            position: relative;
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        /* Desfoque Suave no Fundo */
        .exact-grid-container.blurred-bg .exact-card:not(.slot-center-hero) {
            filter: blur(3px) brightness(0.65);
            transform: scale(0.985);
        }

        /* Cards do Fundo */
        .exact-card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background-color: #1a2236;
            opacity: 0;
            transform: scale(0.75) translateY(35px);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.4s ease;
            will-change: opacity, transform, filter;
        }

        .exact-card.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Overlay Escuro das Fotos */
        .card-tint {
            position: absolute;
            inset: 0;
            background-color: rgba(18, 25, 45, 0.65);
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .exact-card:hover .card-tint {
            opacity: 0.15;
        }

        .exact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .exact-card:hover img {
            transform: scale(1.05);
        }

        /* Posicionamento dos Slots */
        .slot-top-left-tall { grid-column: 1; grid-row: 1 / span 2; }
        .slot-bottom-left-tall { grid-column: 1; grid-row: 3; }

        .slot-top-mid-wide { grid-column: 2 / span 2; grid-row: 1; }
        .slot-mid-left-portrait { grid-column: 2; grid-row: 2; }
        .slot-bottom-mid-solid { grid-column: 2; grid-row: 3; }

        .slot-top-center-solid { grid-column: 4; grid-row: 1; }
        .slot-bottom-center-person { grid-column: 3 / span 2; grid-row: 3; }

        /* Card Central */
        .slot-center-hero {
            grid-column: 3 / span 3;
            grid-row: 2;
            z-index: 20;
            opacity: 1 !important;
            transform: scale(1) translateY(0) !important;
            background-color: transparent !important; /* sem fundo próprio antes do efeito */
        }

        /* Tamanho do card travado: o texto novo não pode aumentar o card */
        .slot-center-hero {
            min-height: 0;
            min-width: 0;
        }

        #heroText {
            font-size: clamp(1.4rem, min(3.1vw, 5vh), 2.75rem);
        }

        #heroSubtext {
            font-size: clamp(0.75rem, min(1.1vw, 1.8vh), 1rem);
        }

        .hero-exact-card {
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            text-align: center;
            position: relative;
            background: transparent;
            box-shadow: none;
            border: none;
            overflow: visible;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /*
          Fundo claro do card central.
          Fica COMPLETAMENTE oculto (visibility: hidden) até o efeito começar,
          assim nem a borda gradiente nem o brilho aparecem antes da hora.
        */
        .hero-bg-overlay {
            position: absolute;
            inset: 0;
            border-radius: var(--r, var(--r0, 28px));
            background: linear-gradient(135deg, #fbfbfe 0%, #eef3f9 50%, #e2e8f5 100%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-out, visibility 0s linear 0.4s;
            z-index: 1;
        }

        .hero-bg-overlay.is-visible {
            visibility: visible;
            transition: opacity 0.4s ease-out, visibility 0s;
        }

        /* Borda Gradiente Festiva (herda a visibilidade do overlay) */
        .hero-bg-overlay::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: calc(var(--r, var(--r0, 28px)) + 2px);
            padding: 2px;
            background: linear-gradient(135deg, #FF00AA, #8A82E5, #47ABF9, #00D5F3, #00E5E2, #00F9CB);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
            opacity: 0.85;
        }

        /* Foco Final com Brilho Intenso */
        .hero-exact-card.hero-focused .hero-bg-overlay {
            box-shadow: 0 30px 70px -10px rgba(0, 213, 243, 0.35),
                        0 0 50px rgba(255, 0, 170, 0.3);
        }

        .hero-exact-card.hero-focused .hero-bg-overlay::before {
            opacity: 1;
        }

        /* Realce que percorre a borda do card (aparece só no estado final) */
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes borderTravel {
            to { --border-angle: 360deg; }
        }

        .hero-bg-overlay::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--r, var(--r0, 28px)) + 3px);
            padding: 4px;
            background: conic-gradient(
                from var(--border-angle),
                transparent 0deg,
                transparent 240deg,
                #FF00AA 285deg,
                #47ABF9 315deg,
                #00F9CB 340deg,
                #ffffff 352deg,
                transparent 360deg
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            filter: drop-shadow(0 0 8px rgba(0, 213, 243, 0.9))
                    drop-shadow(0 0 16px rgba(255, 0, 170, 0.6));
            animation: borderTravel 3.2s linear infinite;
            transition: opacity 0.5s ease;
        }

        .hero-exact-card.hero-focused .hero-bg-overlay::after {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-bg-overlay::after { animation: none; }
        }

        /* Camada branca que preenche o card durante a expansão */
        .hero-white {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
        }

        /* Borda e brilho só somem quando a expansão termina por completo */
        .hero-exact-card.is-expanded .hero-bg-overlay {
            box-shadow: none;
        }
        .hero-exact-card.is-expanded .hero-bg-overlay::before,
        .hero-exact-card.is-expanded .hero-bg-overlay::after {
            opacity: 0;
        }

        .solid-placeholder-card {
            background: #252e42;
        }

        .slot-top-mid-right-person { grid-column: 5; grid-row: 1; }
        .slot-top-right-wide { grid-column: 6; grid-row: 1; }
        .slot-top-far-right-strip { grid-column: 7; grid-row: 1; }

        .slot-mid-right-card1 { grid-column: 6; grid-row: 2; }
        .slot-mid-right-card2 { grid-column: 7; grid-row: 2; }

        .slot-bottom-mid-right-box { grid-column: 5; grid-row: 3; }
        .slot-bottom-right-wide { grid-column: 6; grid-row: 3; }
        .slot-bottom-far-right-strip { grid-column: 7; grid-row: 3; }

        /* Indicador Flutuante */
        .scroll-indicator {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 9999px;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s ease;
        }

        /* ===== Mobile: mesmo efeito, grid adaptado para tela vertical ===== */
        @media (max-width: 768px) {
            :root { --r0: 20px; }

            .sticky-viewport { height: 100vh; height: 100svh; }

            .exact-grid-container {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                grid-template-rows: repeat(3, minmax(0, 0.9fr)) minmax(0, 1.9fr) minmax(0, 1.9fr) repeat(3, minmax(0, 0.9fr));
                gap: 10px;
                height: 100vh;
                height: 100svh;
                padding: 16px 12px 12px 12px;
            }

            .exact-card { border-radius: 14px; }
            .hero-exact-card { border-radius: 20px; padding: 0.75rem 1rem; }

            /* Topo: 8 cards */
            .slot-top-left-tall          { grid-column: 1;          grid-row: 1 / span 2; }
            .slot-top-mid-wide           { grid-column: 2 / span 2; grid-row: 1; }
            .slot-top-center-solid       { grid-column: 4;          grid-row: 1; }
            .slot-mid-left-portrait      { grid-column: 2;          grid-row: 2; }
            .slot-bottom-mid-solid       { grid-column: 3;          grid-row: 2; }
            .slot-top-mid-right-person   { grid-column: 4;          grid-row: 2 / span 2; }
            .slot-bottom-left-tall       { grid-column: 1;          grid-row: 3; }
            .slot-bottom-center-person   { grid-column: 2 / span 2; grid-row: 3; }

            /* Card central ocupa a largura toda */
            .slot-center-hero            { grid-column: 1 / span 4; grid-row: 4 / span 2; }

            /* Base: 7 cards */
            .slot-top-right-wide         { grid-column: 1 / span 2; grid-row: 6; }
            .slot-top-far-right-strip    { grid-column: 3;          grid-row: 6; }
            .slot-mid-right-card1        { grid-column: 4;          grid-row: 6 / span 2; }
            .slot-mid-right-card2        { grid-column: 1;          grid-row: 7; }
            .slot-bottom-mid-right-box   { grid-column: 2 / span 2; grid-row: 7; }
            .slot-bottom-right-wide      { grid-column: 1 / span 2; grid-row: 8; }
            .slot-bottom-far-right-strip { grid-column: 3 / span 2; grid-row: 8; }

            #heroText    { font-size: clamp(1.15rem, 5.4vw, 1.7rem); }
            #heroSubtext { font-size: 0.78rem; margin-top: 0.4rem; }
            #heroBadge   { margin-bottom: 0.4rem; font-size: 0.65rem; }
            #heroButton  { margin-top: 0.75rem; padding: 0.55rem 1.1rem; }

            .scroll-indicator { bottom: 14px; font-size: 11px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

    <!-- Linha Magenta Topo -->
    <div class="top-gradient-bar"></div>

    <!-- Seção Principal com Grid Animação no Scroll -->
    <section class="scroll-section-wrapper" id="experiencia">
        <div class="sticky-viewport">

            <div class="exact-grid-container" id="gridContainer">

                <div class="exact-card slot-top-left-tall bg-card">
                    <img src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?q=80&w=800&auto=format&fit=crop" alt="Office">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-bottom-left-tall bg-card">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" alt="Portrait">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-top-mid-wide bg-card">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=800&auto=format&fit=crop" alt="Team">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-mid-left-portrait bg-card">
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=800&auto=format&fit=crop" alt="Professional">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-bottom-mid-solid solid-placeholder-card bg-card">
                    <div class="card-tint" style="opacity: 0.4;"></div>
                </div>

                <div class="exact-card slot-top-center-solid solid-placeholder-card bg-card">
                    <div class="card-tint" style="opacity: 0.4;"></div>
                </div>

                <div class="exact-card slot-bottom-center-person bg-card">
                    <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?q=80&w=800&auto=format&fit=crop" alt="Laptop user">
                    <div class="card-tint"></div>
                </div>

                <!-- CARD CENTRAL -->
                <div class="exact-card slot-center-hero hero-exact-card" id="heroCard">
                    <div class="hero-bg-overlay" id="heroBgOverlay"><div class="hero-white" id="heroWhite"></div></div>

                    <div class="relative z-10 flex flex-col items-center justify-center">
                        <span id="heroBadge" class="inline-block px-3 py-1 mb-3 rounded-full bg-gradient-to-r from-[#FF00AA]/10 to-[#00F9CB]/10 text-[#FF00AA] font-semibold text-xs uppercase tracking-wider opacity-0 transition-opacity duration-300 border border-[#FF00AA]/20">
                            Design & Performance
                        </span>
                        <h1 id="heroText" class="text-3xl md:text-5xl font-extrabold text-white tracking-tight leading-tight select-none transition-colors duration-500">
                            Criar sites personalizados.
                        </h1>
                        <p id="heroSubtext" class="text-slate-400 text-sm md:text-base mt-3 max-w-sm transition-colors duration-500">
                            Role para baixo para revelar nosso ecossistema de templates.
                        </p>
                        <button id="heroButton" onclick="openModal()" class="mt-6 px-6 py-3 bg-[#111827] hover:bg-[#FF00AA] text-white font-medium text-xs md:text-sm rounded-xl transition-all shadow-lg hover:scale-105 active:scale-95 opacity-0 pointer-events-none">
                            Iniciar Seu Projeto
                        </button>
                    </div>
                </div>

                <div class="exact-card slot-top-mid-right-person bg-card">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop" alt="Person">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-top-right-wide bg-card">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=800&auto=format&fit=crop" alt="Senior">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-top-far-right-strip bg-card">
                    <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=800&auto=format&fit=crop" alt="Portrait">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-mid-right-card1 bg-card">
                    <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=800&auto=format&fit=crop" alt="Working">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-mid-right-card2 bg-card">
                    <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=800&auto=format&fit=crop" alt="Executive">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-bottom-mid-right-box bg-card">
                    <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=800&auto=format&fit=crop" alt="Desk">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-bottom-right-wide bg-card">
                    <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?q=80&w=800&auto=format&fit=crop" alt="Thinking">
                    <div class="card-tint"></div>
                </div>

                <div class="exact-card slot-bottom-far-right-strip bg-card">
                    <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=800&auto=format&fit=crop" alt="Mobile user">
                    <div class="card-tint"></div>

            </div>

            <div class="scroll-indicator" id="scrollIndicator">
                <i class="fa-solid fa-arrow-down-long animate-bounce text-indigo-400"></i>
                <span>Role para revelar os cards</span>
            </div>

    </section>

    <!-- Modal Form -->
    <div id="modal-form" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 text-white rounded-3xl max-w-md w-full p-8 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-2xl font-bold mb-2">Criar Seu Site</h3>
            <p class="text-slate-400 text-sm mb-6">Preencha os campos abaixo para dar o primeiro passo no seu projeto.</p>
            <form onsubmit="handleSend(event)" class="space-y-4">
                <input type="text" placeholder="Seu Nome" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-[#FF00AA]">
                <input type="email" placeholder="Seu E-mail" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-[#00D5F3]">
                <textarea placeholder="Conte-nos brevemente sobre o projeto" rows="3" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-[#00F9CB]"></textarea>
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#FF00AA] via-[#47ABF9] to-[#00F9CB] hover:brightness-110 rounded-xl font-semibold text-sm transition-all shadow-lg shadow-pink-600/30">
                    Enviar Solicitação
                </button>
            </form>
        </div>
    </div>

    <script>
        const wrapper = document.querySelector('.scroll-section-wrapper');
        const gridContainer = document.getElementById('gridContainer');
        const heroCard = document.getElementById('heroCard');
        const heroBgOverlay = document.getElementById('heroBgOverlay');
        const heroWhite = document.getElementById('heroWhite');
        const stickyViewport = document.querySelector('.sticky-viewport');
        const heroText = document.getElementById('heroText');
        const heroSubtext = document.getElementById('heroSubtext');
        const heroBadge = document.getElementById('heroBadge');
        const heroButton = document.getElementById('heroButton');
        const bgCards = Array.from(document.querySelectorAll('.bg-card:not(.slot-center-hero)'));
        const scrollIndicator = document.getElementById('scrollIndicator');

        const initialPhrase = "Criar sites personalizados.";
        const finalPhrase = "Sua presença digital levada ao próximo nível.";

        const initialSubtext = "Role para baixo para revelar nosso ecossistema de templates.";
        const finalSubtext = "Estratégia, performance e design sob medida para o seu negócio.";

        // O fundo do card só começa a surgir depois deste ponto do reveal (0 a 1)
        const OVERLAY_START = 0.15;

        let isCompletedState = false;
        let textTimer = null;
        let ticking = false;

        function swapTexts(title, subtitle) {
            // Cancela troca anterior pendente para evitar texto errado ao rolar rápido
            clearTimeout(textTimer);
            heroText.style.opacity = '0';
            heroSubtext.style.opacity = '0';
            textTimer = setTimeout(() => {
                heroText.textContent = title;
                heroSubtext.textContent = subtitle;
                heroText.style.opacity = '1';
                heroSubtext.style.opacity = '1';
            }, 180);
        }

        function updateScrollAnimation() {
            const wrapperRect = wrapper.getBoundingClientRect();
            const wrapperHeight = wrapper.offsetHeight - window.innerHeight;
            const totalProgress = Math.min(Math.max(-wrapperRect.top / wrapperHeight, 0), 1);

            // Fase 1 (0 a INTRO_END): cards aparecem e card central ganha realce
            // Fase 2 (EXP_START a EXP_END): card cresce até tela cheia e fica branco
            const INTRO_END = 0.43;
            const scrollProgress = Math.min(totalProgress / INTRO_END, 1);

            const revealProgress = Math.min(scrollProgress / 0.65, 1);
            const totalBgCards = bgCards.length;
            const visibleCardsCount = Math.floor(revealProgress * totalBgCards);

            // Animação gradual dos cards do fundo
            bgCards.forEach((card, idx) => {
                card.classList.toggle('show', idx < visibleCardsCount);
            });

            // Fundo claro do card central: totalmente oculto até OVERLAY_START
            const overlayProgress = Math.min(Math.max((revealProgress - OVERLAY_START) / (1 - OVERLAY_START), 0), 1);
            heroBgOverlay.style.opacity = overlayProgress;
            heroBgOverlay.classList.toggle('is-visible', overlayProgress > 0);

            // Texto só fica escuro quando o fundo claro já está bem visível
            const darkText = overlayProgress > 0.5;
            heroText.classList.toggle('text-white', !darkText);
            heroText.classList.toggle('text-[#111827]', darkText);
            heroSubtext.classList.toggle('text-slate-400', !darkText);
            heroSubtext.classList.toggle('text-slate-600', darkText);

            // Estado final: foco, desfoque e troca de frase
            if (scrollProgress >= 0.7) {
                if (!isCompletedState) {
                    isCompletedState = true;
                    gridContainer.classList.add('blurred-bg');
                    heroCard.classList.add('hero-focused');
                    scrollIndicator.style.opacity = '0';

                    heroBadge.classList.remove('opacity-0');
                    heroButton.classList.remove('opacity-0', 'pointer-events-none');

                    swapTexts(finalPhrase, finalSubtext);
                }
            } else {
                if (isCompletedState) {
                    isCompletedState = false;
                    gridContainer.classList.remove('blurred-bg');
                    heroCard.classList.remove('hero-focused');
                    scrollIndicator.style.opacity = '1';

                    heroBadge.classList.add('opacity-0');
                    heroButton.classList.add('opacity-0', 'pointer-events-none');

                    swapTexts(initialPhrase, initialSubtext);
                }
            }

            // Expansão do card até tela cheia
            const EXP_START = 0.5;
            const EXP_END = 0.9;
            const e = Math.min(Math.max((totalProgress - EXP_START) / (EXP_END - EXP_START), 0), 1);
            const eased = e * e * (3 - 2 * e);

            if (eased > 0) {
                const sr = stickyViewport.getBoundingClientRect();
                const cr = heroCard.getBoundingClientRect();
                const top = cr.top - sr.top;
                const left = cr.left - sr.left;
                const right = sr.right - cr.right;
                const bottom = sr.bottom - cr.bottom;
                const baseRadius = window.innerWidth <= 768 ? 20 : 28;
                const bleed = 0;

                heroBgOverlay.style.inset =
                    `${-(top * eased + bleed)}px ${-(right * eased + bleed)}px ${-(bottom * eased + bleed)}px ${-(left * eased + bleed)}px`;
                heroBgOverlay.style.setProperty('--r', `${baseRadius * (1 - eased)}px`);
                heroWhite.style.opacity = eased;
            } else {
                heroBgOverlay.style.inset = '';
                heroBgOverlay.style.removeProperty('--r');
                heroWhite.style.opacity = 0;
            }
            heroCard.classList.toggle('is-expanded', e >= 0.999);
        }

        // Throttle com requestAnimationFrame
        function onScroll() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                updateScrollAnimation();
                ticking = false;
            });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);

        function openModal() {
            const modal = document.getElementById('modal-form');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() {
            const modal = document.getElementById('modal-form');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Fecha o modal com Esc
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function handleSend(e) {
            e.preventDefault();
            closeModal();
            alert('Obrigado! Sua solicitação foi enviada com sucesso.');
        }

        window.addEventListener('DOMContentLoaded', updateScrollAnimation);
    </script>
</body>
</html>
