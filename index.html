@keyframes fxblur{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:none}}@keyframes fxpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes fxfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes fxwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes fxglow{0%,100%{text-shadow:0 0 0 transparent;box-shadow:0 0 0 transparent}50%{text-shadow:0 0 14px var(--sa);box-shadow:0 0 18px var(--sa)}}

.fx:not(.sb){display:inline-block;max-width:100%}
.fx-pre{opacity:0}
.fx-in.fx-fade{animation:fxfade .9s both}.fx-in.fx-up{animation:fxup .8s both}.fx-in.fx-left{animation:fxleft .8s both}.fx-in.fx-zoom{animation:fxzoom .7s both}.fx-in.fx-blur{animation:fxblur .9s both}
.fx-pulse{animation:fxpulse 1.6s ease-in-out infinite}.fx-float{animation:fxfloat 2.6s ease-in-out infinite}.fx-wiggle{animation:fxwig 1.8s ease-in-out infinite}.fx-glow{animation:fxglow 2s ease-in-out infinite}

.fx-hlift,.fx-hgrow,.fx-hglow{transition:transform .2s,box-shadow .2s,text-shadow .2s}
.fx-hlift:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.25)}.fx-hgrow:hover{transform:scale(1.08)}.fx-hglow:hover{box-shadow:0 0 20px var(--sa);text-shadow:0 0 12px var(--sa)}
