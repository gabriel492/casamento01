<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festeva — Construtor de sites (protótipo)</title>
<style>
:root{--bg:#f4f1ee;--pn:#fff;--tx:#201a16;--mu:#6d625b;--bd:#e3dcd5;--ac:#7a4a32;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14100e;--pn:#1e1814;--tx:#f2ece7;--mu:#a99d94;--bd:#352c26;--ac:#d9a77f;--on:#1b1410}}
:root[data-theme="dark"]{--bg:#14100e;--pn:#1e1814;--tx:#f2ece7;--mu:#a99d94;--bd:#352c26;--ac:#d9a77f;--on:#1b1410}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:var(--pn);border-right:1px solid var(--bd);padding:16px;overflow:auto}
.brand{font-weight:800;font-size:18px;margin-bottom:12px}.brand small{font-weight:500;color:var(--mu);font-size:12px;margin-left:6px}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button,.bar button,.chip{font:inherit;border:1px solid var(--bd);background:transparent;color:var(--tx);padding:7px 11px;border-radius:99px;cursor:pointer}
.tabs button.on,.bar button.on,.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{resize:vertical;min-height:80px}input[type=color]{padding:2px;height:36px}
.row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
.row span{flex:1}.row input{width:auto}.row button{border:0;background:var(--bg);color:var(--tx);border-radius:7px;width:28px;height:28px;cursor:pointer}
.hint{color:var(--mu);font-size:12px;margin:0 0 10px}
.kpi{display:flex;gap:8px;margin-bottom:10px}.kpi div{flex:1;border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px}
main{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--pn);align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.grow{flex:1}.bar .pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.stage{padding:20px 16px 40px;flex:1;min-width:0}
.site{max-width:100%;margin:0 auto;border-radius:14px;overflow:clip;box-shadow:0 10px 40px rgba(0,0,0,.18);background:var(--sb);color:var(--st);font-family:var(--sf)}
.site.mob{max-width:390px}
.site section{padding:34px 24px;text-align:center}
.site h2{margin:0 0 12px;color:var(--sa);font-size:26px}
.site p{margin:0 0 8px}
.hero{background:linear-gradient(160deg,var(--sa),var(--sg));color:var(--sh);padding:70px 24px!important}
.hero h1{font-size:clamp(30px,6vw,52px);margin:6px 0 10px;line-height:1.1}.hero .k{letter-spacing:.2em;text-transform:uppercase;font-size:12px;opacity:.85}
.count{display:inline-block;margin-top:18px;background:color-mix(in srgb,var(--sh) 18%,transparent);padding:10px 18px;border-radius:999px}
.prog{max-width:420px;margin:0 auto;text-align:left}.prog div{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--st) 15%,transparent)}.prog b{color:var(--sa);min-width:52px}
.map{height:150px;border-radius:var(--sr);margin:12px auto;max-width:480px;display:grid;place-items:center;background:color-mix(in srgb,var(--sa) 14%,var(--sb));font-size:30px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:0 auto}.gal i{aspect-ratio:1;border-radius:10px;display:block}
.sb,.site button{font:inherit;background:var(--sa);color:var(--sh);border:0;padding:11px 18px;border-radius:var(--sr);cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.f{max-width:360px;margin:0 auto;display:grid;gap:8px}.f input,.f select{background:#fff;color:#222;border:1px solid #ddd}
.gifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;max-width:520px;margin:0 auto}.gifts div{border:1px solid color-mix(in srgb,var(--st) 18%,transparent);border-radius:12px;padding:14px}
.gifts b{display:block;font-size:20px;margin:4px 0 10px;color:var(--sa)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;max-width:90vw;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.on{opacity:1}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,57px));z-index:4;background:color-mix(in srgb,var(--sb) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid color-mix(in srgb,var(--st) 14%,transparent)}
.nav b{color:var(--sa);font-size:16px}.nl{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.nl a{cursor:pointer;color:var(--st);font-weight:600}.nl a:hover{color:var(--sa)}
.site section{scroll-margin-top:70px}#s-rsvp,#s-presentes{min-height:420px;padding-top:56px}.nl a.cur{color:var(--sa);border-bottom:2px solid var(--sa)}.sb{text-align:center}
.site.edit [data-e]{cursor:text;border-radius:4px}.site.edit [data-e]:hover{background:rgba(127,127,127,.22)}
.site.edit [data-e]:focus{outline:2px solid currentColor;outline-offset:2px;background:rgba(127,127,127,.22)}
.site.edit [data-e]:empty::before{content:"…";opacity:.5}
.site.edit [data-pick]{cursor:pointer;border-bottom:1px dashed currentColor}
.site.edit .f input,.site.edit .f select{pointer-events:none;opacity:.75}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.swc{display:flex;align-items:center;gap:6px;padding:8px;border:2px solid;border-radius:10px;font:inherit;font-size:12px;cursor:pointer;text-align:left}.swc.on{outline:2px solid var(--ac);outline-offset:1px}.swc i{width:14px;height:14px;border-radius:50%;flex:none}
details{margin-top:14px;border-top:1px solid var(--bd);padding-top:10px}summary{cursor:pointer;font-weight:600}
.up{display:none;margin:14px 4px 0;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font:600 12px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}.site.edit .up{display:inline-block}
.gi{position:relative}.gi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}.gi .up{position:absolute;top:4px;right:4px;margin:0;padding:3px 9px}
#fmt{position:fixed;z-index:30;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.28);max-width:min(560px,94vw)}
#fmt[hidden]{display:none}#fmt select,#fmt button{width:auto;font:inherit;padding:5px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);cursor:pointer}
#fmt .cl{display:flex;align-items:center;gap:5px;margin:0;font-size:12px;color:var(--tx)}#fmt input[type=color]{width:34px;height:28px;padding:1px}
.sws{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.site .swp{width:46px;height:46px;padding:0;border:3px solid color-mix(in srgb,var(--st) 22%,transparent);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.swp::-webkit-color-swatch-wrapper{padding:0}.swp::-webkit-color-swatch{border:0;border-radius:50%}.swp::-moz-color-swatch{border:0;border-radius:50%}
.site:not(.edit) .swp{pointer-events:none}
.bi{max-width:520px;width:100%;border-radius:14px;display:block;margin:0 auto}
.site .urlin{width:min(320px,90%);background:#fff;color:#222;border:0;font:12px system-ui,sans-serif;box-shadow:none}
.add{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.add button{font:inherit;padding:9px;border:1px dashed var(--bd);border-radius:10px;background:transparent;color:var(--tx);cursor:pointer;text-align:left}.add button:hover{border-color:var(--ac)}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;max-width:640px;margin:18px auto 0;text-align:left}
.note{position:relative;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--sa) 12%,var(--sb));border:1px solid color-mix(in srgb,var(--sa) 30%,transparent)}
.note p{margin:0 0 8px;font-style:italic}.note b{color:var(--sa);font-size:13px}.note .up{position:absolute;top:6px;right:6px;margin:0;padding:2px 8px}
.f textarea{background:#fff;color:#222;border:1px solid #ddd}.site.edit .f textarea{pointer-events:none;opacity:.75}
.site [id^="b-"]{scroll-margin-top:calc(var(--barh,57px) + 66px)}
.row{flex-wrap:wrap}.mrow{width:100%;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}.mrow label{display:flex;gap:6px;align-items:center;margin:0;color:var(--mu)}.mrow input[type=text]{flex:1;width:auto;padding:5px 8px}
.more{position:relative}.mbtn{cursor:pointer;font-weight:600;color:var(--st)}.mbtn:hover,.more.open .mbtn{color:var(--sa)}
.dd{display:none;position:absolute;right:0;top:calc(100% + 12px);min-width:190px;flex-direction:column;gap:2px;background:var(--sb);border:1px solid color-mix(in srgb,var(--st) 16%,transparent);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:6px;z-index:8}
.more.open .dd{display:flex}.dd a{padding:9px 12px;border-radius:8px;white-space:nowrap}.dd a:hover,.dd a.cur{background:color-mix(in srgb,var(--sa) 14%,transparent);border-bottom:0}
@keyframes fxfade{from{opacity:0}to{opacity:1}}@keyframes fxup{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fxleft{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}@keyframes fxzoom{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes fxblur{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:none}}@keyframes fxpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes fxfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes fxwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes fxglow{0%,100%{text-shadow:0 0 0 transparent;box-shadow:0 0 0 transparent}50%{text-shadow:0 0 14px var(--sa);box-shadow:0 0 18px var(--sa)}}
@keyframes fxshine{to{transform:translateX(100%)}}
.fx:not(.sb){display:inline-block;max-width:100%}
.fx-pre{opacity:0}
.fx-in.fx-fade{animation:fxfade .9s both}.fx-in.fx-up{animation:fxup .8s both}.fx-in.fx-left{animation:fxleft .8s both}.fx-in.fx-zoom{animation:fxzoom .7s both}.fx-in.fx-blur{animation:fxblur .9s both}
.fx-pulse{animation:fxpulse 1.6s ease-in-out infinite}.fx-float{animation:fxfloat 2.6s ease-in-out infinite}.fx-wiggle{animation:fxwig 1.8s ease-in-out infinite}.fx-glow{animation:fxglow 2s ease-in-out infinite}
.fx-shimmer{position:relative;overflow:hidden}.fx-shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:fxshine 2.2s infinite}
.fx-hlift,.fx-hgrow,.fx-hglow{transition:transform .2s,box-shadow .2s,text-shadow .2s}
.fx-hlift:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.25)}.fx-hgrow:hover{transform:scale(1.08)}.fx-hglow:hover{box-shadow:0 0 20px var(--sa);text-shadow:0 0 12px var(--sa)}
.site.edit .fx:focus-within,.site.edit .fx:focus{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.fx,.fx::after,.fx-pre{animation:none!important;transition:none!important}.fx-pre{opacity:1!important}}
.prog .up{margin:0 0 0 auto;padding:2px 9px;align-self:center}
.xb{padding:20px 24px}.kid{position:relative}.kid .kx{display:none}.site.edit .kid .kx{display:inline-block;margin:0 0 18px}
.xadd{display:none;padding:10px 0}.site.edit .xadd{display:block}
.xprompt{border:2px dashed color-mix(in srgb,var(--sa) 55%,transparent);border-radius:14px;padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--st);margin-bottom:8px}
.xprompt b{color:var(--sa);font-size:1.05em}.xprompt span{font-size:12px;opacity:.75}.xprompt:hover{background:color-mix(in srgb,var(--sa) 8%,transparent)}
.xp{border:2px solid var(--sa);border-radius:14px;padding:16px;margin-bottom:8px}.xp p{margin:0 0 10px;font-weight:600}
.chipx{display:inline-block;margin:4px;padding:8px 14px;border-radius:999px;background:var(--sa);color:var(--sh);font:600 12px system-ui,sans-serif;cursor:pointer}.chipx.gh{background:transparent;color:var(--st);border:1px solid color-mix(in srgb,var(--st) 30%,transparent)}
.site:not(.edit) .xb.empty{display:none}
.hero{position:relative}
.hero.fr::before{content:"";position:absolute;inset:14px;pointer-events:none}
.fr-thin::before{border:1px solid var(--fc)}.fr-double::before{border:5px double var(--fc)}.fr-dotted::before{border:3px dotted var(--fc)}
.fr-round::before{border:2px solid var(--fc);border-radius:30px}.fr-arch::before{border:2px solid var(--fc);border-radius:50% 50% 0 0/62% 62% 0 0}
.fr-neon::before{border:2px solid var(--fc);border-radius:10px;box-shadow:0 0 12px var(--fc),inset 0 0 12px var(--fc)}
.fr-deco::before{border:2px solid var(--fc)}.fr-deco::after{content:"";position:absolute;inset:24px;border:1px solid var(--fc);pointer-events:none}
.fr-corners::before{background:linear-gradient(var(--fc),var(--fc)) 0 0/38px 2px,linear-gradient(var(--fc),var(--fc)) 0 0/2px 38px,linear-gradient(var(--fc),var(--fc)) 100% 0/38px 2px,linear-gradient(var(--fc),var(--fc)) 100% 0/2px 38px,linear-gradient(var(--fc),var(--fc)) 0 100%/38px 2px,linear-gradient(var(--fc),var(--fc)) 0 100%/2px 38px,linear-gradient(var(--fc),var(--fc)) 100% 100%/38px 2px,linear-gradient(var(--fc),var(--fc)) 100% 100%/2px 38px;background-repeat:no-repeat}
.hero.fr-polaroid{box-shadow:inset 0 0 0 14px var(--fc),inset 0 0 0 15px rgba(0,0,0,.14)}
.fr-floral::before,.fr-leaf::before,.fr-heart::before,.fr-party::before{border:1px solid color-mix(in srgb,var(--fc) 55%,transparent)}

/* Estilos Molduras Horizontais */
.hero-aniv-bolo{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;align-items:center;padding:10px;text-align:left;position:relative;}
.aniv-bolo-decor{background:rgba(255,255,255,0.12);border-radius:16px;padding:20px;border:2px dashed var(--fc);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.aniv-bolo-foto{width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:rgba(0,0,0,0.1);position:relative;box-shadow:0 8px 24px rgba(0,0,0,0.15);}
.aniv-bolo-foto img{width:100%;height:100%;object-fit:cover;display:block;}

.hero-aniv-cupcake{padding:10px;position:relative;}
.aniv-cupcake-grid{display:flex;align-items:center;justify-content:center;gap:20px;margin:15px 0;}
.aniv-cupcake-circle{width:150px;height:150px;border-radius:50%;background:#fff;border:4px solid var(--fc);overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(0,0,0,0.12);flex-shrink:0;}
.aniv-cupcake-circle img{width:100%;height:100%;object-fit:cover;display:block;}

.fk{position:absolute;font-style:normal;font-size:30px;line-height:1;pointer-events:none}.fk.tl{top:18px;left:20px}.fk.tr{top:18px;right:20px;transform:scaleX(-1)}.fk.bl{bottom:18px;left:20px;transform:scaleY(-1)}.fk.br{bottom:18px;right:20px;transform:scale(-1)}
.up.frm{display:none}.site.edit .up.frm{display:inline-flex;align-items:center;gap:8px}.up select{width:auto;padding:3px 8px;color:#222;background:#fff;border:1px solid #ccc;border-radius:8px;font:12px system-ui,sans-serif}.up input[type=color]{width:30px;height:24px;padding:0;border:0;background:none}
@media(max-width:820px){.bar{flex-wrap:nowrap;overflow-x:auto}.bar button{white-space:nowrap;flex:none}.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--bd)}.hero-aniv-bolo{grid-template-columns:1fr;text-align:center;}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">🎉 Festeva <small>construtor de sites</small></div>
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </aside>
  <main>
    <div class="bar">
      <button data-md="edit" class="on">✏️ Editar</button><button data-md="test">▶ Testar</button><span style="width:8px"></span><button data-pg="home" class="on">Início</button><button data-pg="presentes">Presentes</button><button data-pg="rsvp">Confirmação</button><span style="width:8px"></span><button data-m="desk" class="on">Computador</button><button data-m="mob">Celular</button>
      <span class="grow"></span><button class="pri" id="pub">Publicar</button>
    </div>
    <div class="stage"><div id="site" class="site"></div></div>
  </main>
</div>
<input type="file" id="fcover" accept="image/*" hidden>
<input type="file" id="fblk" accept="image/*" hidden>
<input type="file" id="fgal" accept="image/*" multiple hidden>
<div id="fmt" hidden>
 <select id="ff" title="Fonte"></select>
 <button id="fm" title="Diminuir letra">A−</button><button id="fp" title="Aumentar letra">A+</button>
 <button id="fb" title="Negrito"><b>N</b></button><button id="fi" title="Itálico"><i>I</i></button>
 <label class="cl">Texto <input type="color" id="fc"></label>
 <label class="cl" id="fbgw">Botão <input type="color" id="fbg"></label>
 <select id="fx" title="Efeito"></select>
 <button id="fr" title="Voltar ao padrão do tema">↺ Padrão</button>
</div>
<div class="toast" id="toast"></div>

 else if(el=q('[data-th]')){applyTheme(el.dataset.th);renderPanel();renderSite()}
 else if(el=q('[data-pg]')){setPage(el.dataset.pg)}
 else if(el=q('[data-mv]')){const[i,d]=el.dataset.mv.split(',').map(Number);let j=i+d;while(j>=0&&j<S.blocks.length&&!isHome(S.blocks[j]))j+=d;if(j>=0&&j<S.blocks.length){[S.blocks[i],S.blocks[j]]=[S.blocks[j],S.blocks[i]];renderPanel();renderSite()}}
 else if(el=q('[data-add]')){const t=el.dataset.add,n=++CN;{const nm=t==='extra'?'Bloco extra':CT.find(c=>c[0]===t)[1].replace(/^\S+\s/,'');const num=t==='extra'?S.blocks.filter(x=>x.type==='extra').length+1:n;S.blocks.push({id:'c'+n,type:t,on:true,lbl:nm+' '+num,ml:t==='extra'?'Extras':nm+' '+num,menu:false,cnt:3,kids:t==='extra'?[]:undefined,open:false})}renderPanel();renderSite();toast('Bloco criado.')}
 else if(el=q('[data-del]')){S.blocks.splice(+el.dataset.del,1);renderPanel();renderSite()}
 else if(el=q('[data-xopen]')){const b=findB(el.dataset.xopen);if(b){b.open=true;renderSite()}}
 else if(el=q('[data-xclose]')){const b=findB(el.dataset.xclose);if(b){b.open=false;renderSite()}}
 else if(el=q('[data-kadd]')){const[id,t]=el.dataset.kadd.split(':'),b=findB(id);if(b){b.kids.push({id:'k'+(++CN),type:t,cnt:3});b.open=false;renderSite()}}
 else if(el=q('[data-kdel]')){const[id,i]=el.dataset.kdel.split(':'),b=findB(id);if(b){b.kids.splice(+i,1);renderSite()}}
 else if(el=q('[data-xnew]')){const i=S.blocks.findIndex(x=>x.id===el.dataset.xnew),n=++CN,nx=S.blocks.filter(x=>x.type==='extra').length+1;S.blocks.splice(i+1,0,{id:'c'+n,type:'extra',on:true,lbl:'Bloco extra '+nx,ml:'Extras',menu:false,kids:[],open:true});renderPanel();renderSite()}
 else if(q('[data-padd]')){if(S.pn<12){S.pn++;renderSite()}}
 else if(el=q('[data-pdel]')){const i=+el.dataset.pdel,n=S.pn;if(n>1){
  const rows=Array.from({length:n},(_,j)=>[g('pt'+j,pdef(j)[0]),g('pa'+j,pdef(j)[1]),S.xs['pt'+j],S.xs['pa'+j]]);rows.splice(i,1);
  for(let j=0;j<n;j++){delete S.x['pt'+j];delete S.x['pa'+j];delete S.xs['pt'+j];delete S.xs['pa'+j]}
  rows.forEach((r,j)=>{S.x['pt'+j]=r[0];S.x['pa'+j]=r[1];if(r[2])S.xs['pt'+j]=r[2];if(r[3])S.xs['pa'+j]=r[3]});
  S.pn=n-1;S.dirty=true;renderSite()}}
 else if(el=q('[data-ladd]')){const b=findB(el.dataset.ladd);if(b&&b.cnt<8){b.cnt++;renderSite()}}
 else if(el=q('[data-ldel]')){const b=findB(el.dataset.ldel);if(b&&b.cnt>1){b.cnt--;renderSite()}}
 else if(q('[data-swadd]')){if(S.dc.length<6){S.dc.push('#999999');renderSite()}}
 else if(q('[data-swdel]')){if(S.dc.length>1){S.dc.pop();renderSite()}}
 else if(el=q('[data-upb]')){blkT=el.dataset.upb;$('#fblk').click()}
 else if(el=q('[data-rmb]')){const b=findB(el.dataset.rmb);if(b){b.img=null;renderSite()}}
 else if(el=q('[data-up]')){$(el.dataset.up==='cover'?'#fcover':'#fgal').click()}
 else if(q('[data-rmc]')){S.cover=null;renderSite()}
 else if(el=q('[data-rm]')){S.gal.splice(+el.dataset.rm,1);renderSite()}
 else if(q('[data-fcr]')){S.fc=null;renderSite()}
 else if(el=q('[data-more]')){el.closest('.more').classList.toggle('open')}
 else if(el=q('[data-go]')){navTo(el.dataset.go)}
 else if(edit&&q('[data-act]')){}
 else if(el=q('[data-act="rsvp"]')){const n=$('#rn').value.trim();if(!n){toast('Digite seu nome.');return}
  S.rsvp.push({n,s:$('#rs').value,g:Math.max(1,+$('#rg').value||1)});toast('Presença registrada!');renderSite();if(S.tab==='Painel')renderPanel()}
 else if(el=q('[data-act="mural"]')){const n=$('#mn').value.trim(),m=$('#mm').value.trim();if(!n||!m){toast('Preencha seu nome e o recado.');return}
  S.mural.unshift({n,m});toast('Recado publicado!');renderSite();if(S.tab==='Painel')renderPanel()}
 else if(el=q('[data-msite]')){S.mural.splice(+el.dataset.msite,1);renderSite();if(S.tab==='Painel')renderPanel()}
 else if(el=q('[data-mdel]')){S.mural.splice(+el.dataset.mdel,1);renderPanel();renderSite()}
 else if(q('#pub')){toast('Publicado (simulação): festeva.com/'+slug())}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.e!==undefined){const k=t.dataset.e;setv(k,t.textContent);$('#site').querySelectorAll('[data-e="'+k+'"]').forEach(o=>{if(o!==t&&o.textContent!==t.textContent)o.textContent=t.textContent})}
 else if(t.dataset.fc!==undefined){S.fc=t.value;const h=document.querySelector('#site .hero');if(h)h.style.setProperty('--fc',t.value)}
 else if(t.dataset.ml!==undefined){S.blocks[+t.dataset.ml].ml=t.value;renderSite()}
 else if(t.dataset.sw!==undefined){S.dc[+t.dataset.sw]=t.value}
 else if(t.dataset.url!==undefined){const b=findB(t.dataset.url);if(b)b.url=t.value}
 else if(t.dataset.k){S[t.dataset.k]=t.value;if(['name','msg'].includes(t.dataset.k))S.dirty=true;renderSite()}
});
document.addEventListener('change',e=>{if(e.target.dataset.fr!==undefined){S.frame=e.target.value;renderSite();return}
 if(e.target.dataset.mn!==undefined){S.blocks[+e.target.dataset.mn].menu=e.target.checked;renderPanel();renderSite();return}
 if(e.target.dataset.tsel!==undefined){applyTheme(e.target.value);renderPanel();renderSite();return}
 if(e.target.dataset.on!==undefined){S.blocks[+e.target.dataset.on].on=e.target.checked;renderSite()}});
const barH=()=>document.documentElement.style.setProperty('--barh',$('.bar').offsetHeight+'px');
barH();window.addEventListener('resize',barH);if(window.ResizeObserver)new ResizeObserver(barH).observe($('.bar'));
let cur=null;const fmt=$('#fmt');
const FXL=[['Ao aparecer na tela',[['fade','Aparecer suavemente'],['up','Subir'],['left','Deslizar da esquerda'],['zoom','Zoom'],['blur','Desfocar → nítido']]],['Contínuos',[['pulse','Pulsar'],['float','Flutuar'],['glow','Brilho pulsante'],['wiggle','Balançar'],['shimmer','Reflexo']]],['Ao passar o mouse',[['hlift','Elevar'],['hgrow','Aumentar'],['hglow','Brilho']]]];
const ENTRY=['fade','up','left','zoom','blur'];
$('#fx').innerHTML='<option value="">✨ Sem efeito</option>'+FXL.map(g=>`<optgroup label="${g[0]}">${g[1].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</optgroup>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('fx-pre');e.target.classList.add('fx-in');io.unobserve(e.target)}}),{threshold:.15});
function applyFx(el,fx){const t=el.closest('.sb')||el;[...t.classList].filter(c=>c==='fx'||c.startsWith('fx-')).forEach(c=>t.classList.remove(c));
 if(!fx)return;t.classList.add('fx','fx-'+fx);if(ENTRY.includes(fx)&&!edit){t.classList.add('fx-pre');io.observe(t)}}
function replayFx(el){const t=el.closest('.sb')||el;if(ENTRY.some(x=>t.classList.contains('fx-'+x))){t.classList.remove('fx-pre','fx-in');void t.offsetWidth;t.classList.add('fx-in')}}
$('#ff').innerHTML='<option value="">Fonte do tema</option>'+FONTS.map(f=>`<option value='${f[1]}'>${f[0]}</option>`).join('');
const hex=c=>'#'+(c.match(/\d+/g)||[0,0,0]).slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');
const fkey=el=>el.dataset.f||el.dataset.e;
function hideFmt(){fmt.hidden=true;cur=null}
function posFmt(){if(!cur||!document.contains(cur))return hideFmt();const r=cur.getBoundingClientRect(),h=fmt.offsetHeight,w=fmt.offsetWidth;
 let t=r.top-h-8;if(t<8)t=r.bottom+8;fmt.style.top=Math.min(t,innerHeight-h-8)+'px';fmt.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px'}
function showFmt(el){cur=el;const cs=getComputedStyle(el),o=S.xs[fkey(el)]||{},sb=el.closest('.sb');
 $('#ff').value=o.f||'';$('#fx').value=o.fx\vert{}\vert{}'';$('#fc').value=hex(cs.color);$('#fbgw').style.display=sb?'flex':'none';if(sb)$('#fbg').value=hex(getComputedStyle(sb).backgroundColor);
 fmt.hidden=false;posFmt()}
function setFmt(patch){if(!cur)return;const k=fkey(cur);S.xs[k]=Object.assign(S.xs[k]||{},patch);
 $('#site').querySelectorAll('[data-e]').forEach(o=>{if(fkey(o)===k){o.setAttribute('style',fmtStyle(k));const sb=o.closest('.sb');if(sb&&S.xs[k].bg)sb.style.background=S.xs[k].bg;applyFx(o,S.xs[k].fx)}});posFmt()}
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-e]');if(edit&&el&&$('#site').contains(el))showFmt(el)});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#fmt')&&!e.target.closest('#site [data-e]'))hideFmt()});
window.addEventListener('scroll',()=>{if(cur)posFmt()},{passive:true});
$('#ff').onchange=e=>setFmt({f:e.target.value||undefined});
$('#fx').onchange=e=>{setFmt({fx:e.target.value||undefined});if(cur)replayFx(cur)};
$('#fc').oninput=e=>setFmt({c:e.target.value});
$('#fbg').oninput=e=>setFmt({bg:e.target.value});
$('#fm').onclick=()=>cur&&setFmt({s:Math.max(8,Math.round(parseFloat(getComputedStyle(cur).fontSize)-2))});
$('#fp').onclick=()=>cur&&setFmt({s:Math.round(parseFloat(getComputedStyle(cur).fontSize)+2)});
$('#fb').onclick=()=>cur&&setFmt({b:+getComputedStyle(cur).fontWeight>=600?'400':'700'});
$('#fi').onclick=()=>cur&&setFmt({i:getComputedStyle(cur).fontStyle==='italic'?'normal':'italic'});
$('#fr').onclick=()=>{if(!cur)return;const k=fkey(cur);delete S.xs[k];$('#site').querySelectorAll('[data-e]').forEach(o=>{if(fkey(o)===k){o.removeAttribute('style');const sb=o.closest('.sb');if(sb)sb.style.background='';applyFx(o,null)}});showFmt(cur)};
const loadImg=f=>new Promise(r=>{const fr=new FileReader();fr.onerror=()=>r(null);fr.onload=()=>{const im=new Image();im.onerror=()=>r(null);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(f)});
$('#fcover').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const u=await loadImg(f);if(u){S.cover=u;renderSite()}else toast('Erro ao ler imagem.')};
$('#fblk').onchange=async e=>{const f=e.target.files[0];e.target.value='';const b=findB(blkT);if(!f||!b)return;const u=await loadImg(f);if(u){b.img=u;renderSite()}else toast('Erro ao ler imagem.')};
$('#fgal').onchange=async e=>{const fs=[...e.target.files].slice(0,12-S.gal.length);e.target.value='';for(const f of fs){const u=await loadImg(f);if(u)S.gal.push(u)}renderSite()};
all();
</script>
</body>
