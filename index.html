<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de Sites Personalizados — Grid Exato</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0e17;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top Left Accent Gradient Bar from original photo */
        .top-gradient-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 140px;
            height: 6px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            border-bottom-right-radius: 4px;
            z-index: 50;
        }

        /* Main Fixed Canvas/Viewport Grid Layout matching the reference photo exactly */
        .exact-grid-container {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr 1.8fr 0.9fr 1fr 1.5fr 0.8fr;
            grid-template-rows: 1.1fr 1.4fr 1.1fr;
            gap: 14px;
            width: 100vw;
            height: 100vh;
            padding: 16px;
            position: relative;
        }

        /* Individual Card Container Base */
        .exact-card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background-color: #1a2236;
            opacity: 0;
            transform: scale(0.92) translateY(15px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .exact-card.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Dark tint layer matching image color tone */
        .card-tint {
            position: absolute;
            inset: 0;
            background-color: rgba(18, 25, 45, 0.72);
            backdrop-filter: saturate(70%) contrast(105%);
            transition: opacity 0.4s ease;
            z-index: 2;
        }

        .exact-card:hover .card-tint {
            opacity: 0.2;
        }

        .exact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .exact-card:hover img {
            transform: scale(1.05);
        }

        /* Specific Exact Grid Positions mapped directly to screenshot slots */
        
        /* Left Column */
        .slot-top-left-tall { grid-column: 1; grid-row: 1 / span 2; }
        .slot-bottom-left-tall { grid-column: 1; grid-row: 3; }

        /* Mid-Left Column */
        .slot-top-mid-wide { grid-column: 2 / span 2; grid-row: 1; }
        .slot-mid-left-portrait { grid-column: 2; grid-row: 2; }
        .slot-bottom-mid-solid { grid-column: 2; grid-row: 3; }

        /* Center Column (Top & Bottom fillers) */
        .slot-top-center-solid { grid-column: 4; grid-row: 1; }
        .slot-bottom-center-person { grid-column: 3 / span 2; grid-row: 3; }

        /* Center Main Hero Card Area (Spans Column 3-5, Row 2) */
        .slot-center-hero {
            grid-column: 3 / span 3;
            grid-row: 2;
            z-index: 10;
        }

        /* Mid-Right / Top-Right Column */
        .slot-top-mid-right-person { grid-column: 5; grid-row: 1; }
        .slot-top-right-wide { grid-column: 6; grid-row: 1; }
        .slot-top-far-right-strip { grid-column: 7; grid-row: 1; }

        .slot-mid-right-card1 { grid-column: 6; grid-row: 2; }
        .slot-mid-right-card2 { grid-column: 7; grid-row: 2; }

        /* Bottom Right Column */
        .slot-bottom-mid-right-box { grid-column: 5; grid-row: 3; }
        .slot-bottom-right-wide { grid-column: 6; grid-row: 3; }
        .slot-bottom-far-right-strip { grid-column: 7; grid-row: 3; }

        /* Exact Central Hero Card Style from Screenshot */
        .hero-exact-card {
            background: linear-gradient(135deg, #fbfbfe 0%, #eef3f9 50%, #e2e8f5 100%);
            border-radius: 28px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Solid Color Placeholder Cards (matches grey/tinted cards in original photo) */
        .solid-placeholder-card {
            background: #252e42;
        }

        /* Menu Icon Top Right Over the Grid */
        .floating-menu-btn {
            position: absolute;
            top: 28px;
            right: 28px;
            z-index: 40;
            width: 44 h-44;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .floating-menu-btn:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Re-trigger Animation Button Top Left Floating */
        .floating-replay-btn {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 40;
            padding: 8px 16px;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .floating-replay-btn:hover {
            background: rgba(30, 41, 59, 0.95);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 1024px) {
            body {
                overflow-y: auto;
                height: auto;
            }
            .exact-grid-container {
                display: flex;
                flex-direction: column;
                height: auto;
                padding: 16px;
                gap: 16px;
            }
            .exact-card {
                height: 220px;
            }
            .slot-center-hero {
                height: 320px;
            }
            .top-gradient-bar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Accent Line -->
    <div class="top-gradient-bar"></div>

    <!-- Floating Top-Right Hamburger Menu (Exact to photo) -->
    <button onclick="openModal()" class="floating-menu-btn" title="Menu">
        <i class="fa-solid fa-bars text-sm"></i>
    </button>

    <!-- Floating Replay Animation Control -->
    <button onclick="animateGrid()" class="floating-replay-btn">
        <i class="fa-solid fa-rotate-right text-indigo-400"></i>
        <span>Reanimar Cards</span>
    </button>

    <!-- Exact Screen Grid Layout -->
    <main class="exact-grid-container">

        <!-- 1. Top Left Tall Vertical Card -->
        <div class="exact-card slot-top-left-tall">
            <img src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?q=80&w=800&auto=format&fit=crop" alt="Office Executive">
            <div class="card-tint"></div>
        </div>

        <!-- 2. Bottom Left Vertical Card -->
        <div class="exact-card slot-bottom-left-tall">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" alt="Professional Portrait">
            <div class="card-tint"></div>
        </div>

        <!-- 3. Top Center-Left Wide Meeting Card -->
        <div class="exact-card slot-top-mid-wide">
            <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=800&auto=format&fit=crop" alt="Team Meeting">
            <div class="card-tint"></div>
        </div>

        <!-- 4. Mid Left Portrait Card -->
        <div class="exact-card slot-mid-left-portrait">
            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=800&auto=format&fit=crop" alt="Woman Working">
            <div class="card-tint"></div>
        </div>

        <!-- 5. Bottom Mid Solid Tinted Card (Matching bottom grey block) -->
        <div class="exact-card slot-bottom-mid-solid solid-placeholder-card">
            <div class="card-tint" style="opacity: 0.4;"></div>
        </div>

        <!-- 6. Top Center Solid Placeholder Slot -->
        <div class="exact-card slot-top-center-solid solid-placeholder-card">
            <div class="card-tint" style="opacity: 0.4;"></div>
        </div>

        <!-- 7. Bottom Center Person Card -->
        <div class="exact-card slot-bottom-center-person">
            <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?q=80&w=800&auto=format&fit=crop" alt="Woman laptop">
            <div class="card-tint"></div>
        </div>

        <!-- 8. CENTRAL HERO CARD (Exact text & aesthetic) -->
        <div class="exact-card slot-center-hero hero-exact-card">
            <h1 class="text-3xl md:text-5xl font-extrabold text-[#111827] tracking-tight leading-tight select-none">
                Criar sites personalizados.
            </h1>
            <p class="text-slate-500 text-sm mt-3 max-w-sm hidden md:block">
                Design exclusivo, alta velocidade e otimizado para gerar resultados reais.
            </p>
            <button onclick="openModal()" class="mt-6 px-6 py-2.5 bg-[#111827] hover:bg-slate-800 text-white font-medium text-xs md:text-sm rounded-xl transition-all hover:scale-105 active:scale-95 shadow-lg">
                Fazer Orçamento
            </button>
        </div>

        <!-- 9. Top Mid-Right Coffee Person -->
        <div class="exact-card slot-top-mid-right-person">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=800&auto=format&fit=crop" alt="Man with coffee">
            <div class="card-tint"></div>
        </div>

        <!-- 10. Top Right Wide Card -->
        <div class="exact-card slot-top-right-wide">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=800&auto=format&fit=crop" alt="Senior Professional">
            <div class="card-tint"></div>
        </div>

        <!-- 11. Top Far Right Strip Card -->
        <div class="exact-card slot-top-far-right-strip">
            <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=800&auto=format&fit=crop" alt="Woman Portrait">
            <div class="card-tint"></div>
        </div>

        <!-- 12. Mid Right Card 1 -->
        <div class="exact-card slot-mid-right-card1">
            <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=800&auto=format&fit=crop" alt="Woman Laptop">
            <div class="card-tint"></div>
        </div>

        <!-- 13. Mid Right Card 2 -->
        <div class="exact-card slot-mid-right-card2">
            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=800&auto=format&fit=crop" alt="Executive Woman">
            <div class="card-tint"></div>
        </div>

        <!-- 14. Bottom Mid-Right Box -->
        <div class="exact-card slot-bottom-mid-right-box">
            <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=800&auto=format&fit=crop" alt="Office desk">
            <div class="card-tint"></div>
        </div>

        <!-- 15. Bottom Right Wide Card -->
        <div class="exact-card slot-bottom-right-wide">
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?q=80&w=800&auto=format&fit=crop" alt="Man thinking">
            <div class="card-tint"></div>
        </div>

        <!-- 16. Bottom Far Right Strip -->
        <div class="exact-card slot-bottom-far-right-strip">
            <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=800&auto=format&fit=crop" alt="Person phone">
            <div class="card-tint"></div>
        </div>

    </main>

    <!-- Modal Form -->
    <div id="modal-form" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 text-white rounded-3xl max-w-md w-full p-8 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-2xl font-bold mb-2">Criar Seu Site</h3>
            <p class="text-slate-400 text-sm mb-6">Envie seus dados e entraremos em contato rapidamente.</p>
            <form onsubmit="handleSend(event)" class="space-y-4">
                <input type="text" placeholder="Seu Nome" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500">
                <input type="email" placeholder="Seu E-mail" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500">
                <textarea placeholder="Detalhes do projeto (opcional)" rows="3" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-sm transition-all shadow-lg shadow-indigo-600/30">
                    Enviar Mensagem
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Sequence Controller -->
    <script>
        function animateGrid() {
            const cards = document.querySelectorAll('.exact-card');
            
            // Hide all cards first
            cards.forEach(card => card.classList.remove('show'));

            // Order array for Stagger Animation from center outward
            cards.forEach((card, i) => {
                setTimeout(() => {
                    card.classList.add('show');
                }, i * 45);
            });
        }

        function openModal() {
            const modal = document.getElementById('modal-form');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() {
            const modal = document.getElementById('modal-form');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function handleSend(e) {
            e.preventDefault();
            closeModal();
            alert('Obrigado! Recebemos sua solicitação.');
        }

        // Start grid sequence on load
        window.addEventListener('load', () => {
            setTimeout(animateGrid, 150);
        });
    </script>
</body>
</html>
